[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-route-tracker"
version = "0.1.0"
description = "Track NFL routes from video"
readme = "README.md"
requires-python = ">=3.9"

# Updated pyproject.toml dependencies
dependencies = [
    # Core CV/ML
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",

    # YOLOv8
    "ultralytics>=8.0.0",

    # DeepSORT tracking
    "deep-sort-realtime>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
