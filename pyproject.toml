[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-route-tracker"
version = "0.1.0"
description = "Track NFL routes from video"
readme = "README.md"
requires-python = ">=3.9"
# Updated pyproject.toml dependencies
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    # NEW:
    "ultralytics>=8.0.0",      # YOLOv8
    "bot-sort>=0.1.0",          # BoT-SORT tracker (or custom implementation)
    "fast-reid>=1.3.0",         # OSNet embeddings for BoT-SORT
    "opencv-python>=4.8.0",     # Optical flow
    "scipy>=1.10.0",            # Savitzky-Golay smoothing
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
